[versions]
agp                     = "8.4.0"
kotlin                  = "1.9.23"
coreKtx                 = "1.13.1"
appcompat               = "1.7.0"
material                = "1.12.0"
constraintlayout        = "2.1.4"
lifecycle               = "2.8.2"
navigation              = "2.7.7"
hilt                    = "2.51.1"
firebase-bom            = "33.1.0"
camerax                 = "1.3.3"
workmanager             = "2.9.0"
room                    = "2.6.1"
coroutines              = "1.8.1"
webrtc                  = "125.6422.07"
maps                    = "18.2.0"
biometric               = "1.1.0"
security                = "1.1.0-alpha06"
coil                    = "2.6.0"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
lottie                  = "6.4.0"
mpandroid               = "v3.1.0"
junit                   = "4.13.2"
androidxJunit           = "1.1.5"
espresso                = "3.5.1"

[libraries]
androidx-core-ktx          = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat         = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material                   = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout           = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Lifecycle
lifecycle-viewmodel        = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata         = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime          = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service          = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# Navigation
navigation-fragment        = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui              = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Hilt DI
hilt-android               = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler              = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-work                  = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }

# Firebase
firebase-bom               = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-auth              = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore         = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-realtime-db       = { group = "com.google.firebase", name = "firebase-database-ktx" }
firebase-storage           = { group = "com.google.firebase", name = "firebase-storage-ktx" }
firebase-messaging         = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
firebase-crashlytics       = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }
firebase-analytics         = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-functions        = { group = "com.google.firebase", name = "firebase-functions-ktx" }
coroutines-play-services  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }























































































































































































































































































































































































































































































































# CameraX
camerax-core               = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2            = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle          = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-video              = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }

# WorkManager
workmanager                = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Room
room-runtime               = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                   = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler              = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutines
coroutines-android         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# WebRTC
webrtc                     = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }

# Maps
maps                       = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "maps" }
location                   = { group = "com.google.android.gms", name = "play-services-location", version = "21.3.0" }

# Security
biometric                  = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
security-crypto            = { group = "androidx.security", name = "security-crypto", version.ref = "security" }






















































# Image loading
coil                       = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# Networking
retrofit                   = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson              = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging             = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# UI
lottie                     = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
mpandroid-chart            = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroid" }

# Test
junit                      = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit             = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso                   = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application        = { id = "com.android.application", version.ref = "agp" }
android-library            = { id = "com.android.library", version.ref = "agp" }
kotlin-android             = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt                = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt                       = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services            = { id = "com.google.gms.google-services", version = "4.4.2" }
firebase-crashlytics       = { id = "com.google.firebase.crashlytics", version = "3.0.1" }
